name: Deploy Full Stack

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 테스트 실행 전 JDK 세팅 수행
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. GitHub Actions 러너 내부 가상 컴퓨터에도 설정 파일 임시 생성
      - name: Create Temporary Properties for Test Runner
        run: |
          mkdir -p Back-end/shop-1/shop-1/shop-1/src/main/resources
          echo "${{ secrets.APPLICATION_PROPERTIES }}" > Back-end/shop-1/shop-1/shop-1/src/main/resources/application.properties
          echo "${{ secrets.ENV_FILE }}" > Back-end/shop-1/shop-1/shop-1/.env || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./Back-end/shop-1/shop-1/shop-1

      - name: Run ERD Generation Test
        run: ./gradlew test --tests "com.kkh.shop_1.GenerateErdTest"
        working-directory: ./Back-end/shop-1/shop-1/shop-1

      - name: Check and Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          
          if git diff --staged --quiet; then
            echo "No ERD changes to commit."
          else
            git commit -m "docs: 시스템 엔티티 변경에 따른 ERD 자동 업데이트 [skip ci]"
            git push origin HEAD:main
          fi

      # 3. 서버 업로드 템플릿
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/shop1
            git pull origin main
            
            echo "${{ secrets.ENV_FILE }}" > .env
            
            echo "${{ secrets.APPLICATION_PROPERTIES }}" > Back-end/shop-1/shop-1/shop-1/src/main/resources/application.properties
            
            sudo docker compose down -v
            sudo docker compose up -d --build

            sudo docker image prune -f
