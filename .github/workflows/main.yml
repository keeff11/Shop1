name: Deploy Full Stack

on:
  push:
    branches: [ main ]

# 1. ERD가 반영된 README.md를 깃허브에 다시 푸시하기 위해 권한을 추가합니다.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # === 2. 여기서부터 ERD 자동화 파트가 추가됩니다 ===
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./Back-end/shop-1/shop-1/shop-1

      - name: Run ERD Generation Test
        run: ./gradlew test --tests "com.kkh.shop_1.GenerateErdTest"
        working-directory: ./Back-end/shop-1/shop-1/shop-1

      - name: Check and Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          
          if git diff --staged --quiet; then
            echo "No ERD changes to commit."
          else
            git commit -m "docs: 시스템 엔티티 변경에 따른 ERD 자동 업데이트 [skip ci]"
            git push origin HEAD:main
          fi
      # === ERD 자동화 파트 끝 ===

      # 3. 기존에 잘 되던 템플릿 그대로 유지 (동작 보장)
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/shop1
            git pull origin main
            
            echo "${{ secrets.ENV_FILE }}" > .env
            
            echo "${{ secrets.APPLICATION_PROPERTIES }}" > Back-end/shop-1/shop-1/shop-1/src/main/resources/application.properties
            
            sudo docker compose down -v
            sudo docker compose up -d --build

            sudo docker image prune -f
