version: '3.8'

services:
  # 1. 데이터베이스 (MySQL)
  db:
    image: mysql:8.0
    container_name: shop1-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: shop1
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - shop1-network

  # 2. Redis (캐시 서버)
  redis:
    image: redis:alpine
    container_name: shop1-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - shop1-network

  # 🌟 3. Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: shop1-elasticsearch
    volumes:
      - es_data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node 
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" 
      - xpack.security.enabled=false     
      - xpack.security.http.ssl.enabled=false
    ports:
      # 🌟 중요: 해킹 방지를 위해 127.0.0.1로 로컬에서만 접근 가능하게 제한
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    command: >
      bash -c "
      bin/elasticsearch-plugin install --batch analysis-nori;
      /usr/local/bin/docker-entrypoint.sh
      "
    # 🌟 추가: 백엔드와 통신하기 위해 같은 네트워크에 소속시킴
    networks:
      - shop1-network

  # 🌟 4. 백엔드 (Spring Boot) (수정됨)
  backend:
    build: ./Back-end/shop-1/shop-1/shop-1
    container_name: shop1-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
      - elasticsearch # ES가 켜진 후 백엔드가 켜지도록 순서 보장
    environment:
      # 🌟 추가: Spring Boot에 메모리 다이어트 명령 하달 (OOM Killer 방지)
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      
      # DB 연결 설정
      DB_HOST: shop1-db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD} 
      
      # Redis 연결 설정
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # 🌟 추가: ES 연결 주소를 도커 컨테이너 이름으로 명시
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      
      # CORS 설정
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL}

      # 🌟 추가: 시크릿 값 (repo 루트 .env 에서 주입, git에는 커밋되지 않음)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      KAKAO_API_KEY: ${KAKAO_API_KEY}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      NCP_S3_ACCESS_KEY: ${NCP_S3_ACCESS_KEY}
      NCP_S3_SECRET_KEY: ${NCP_S3_SECRET_KEY}
      KAKAOPAY_SECRET: ${KAKAOPAY_SECRET}
      NAVERPAY_CLIENT_ID: ${NAVERPAY_CLIENT_ID}
      NAVERPAY_CLIENT_SECRET: ${NAVERPAY_CLIENT_SECRET}
      NAVERPAY_CHAIN_ID: ${NAVERPAY_CHAIN_ID}
      NAVERPAY_PARTNER_ID: ${NAVERPAY_PARTNER_ID}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      GMAIL_SMTP_USERNAME: ${GMAIL_SMTP_USERNAME}
      GMAIL_SMTP_APP_PASSWORD: ${GMAIL_SMTP_APP_PASSWORD}

      TZ: Asia/Seoul
    networks:
      - shop1-network

  # 5. 프론트엔드 (Next.js)
  frontend:
    build: ./Front-end/frontend
    container_name: shop1-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - shop1-network

networks:
  shop1-network:
    name: shop1-network
    driver: bridge

volumes:
  es_data: